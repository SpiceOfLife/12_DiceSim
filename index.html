<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 12面体カスタムサイコロ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle, #2c3e50, #0f171e);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-container {
            position: absolute;
            bottom: 10%;
            left: 40%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        button {
            background: linear-gradient(135deg, #e67e22, #d35400);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(230, 126, 34, 0.4);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        #result {
            position: absolute;
            top: 10%;
            left: 40%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 5px 10px rgba(0,0,0,0.5);
            font-family: 'Georgia', serif;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 10;
        }

        #result.show {
            opacity: 1;
            transform: translateX(-50%) scale(1.1);
        }

        /* 右側の入力サイドパネル */
        #input-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 280px;
            height: 100vh;
            background: rgba(15, 23, 30, 0.85);
            backdrop-filter: blur(10px);
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
            padding: 20px;
            color: #fff;
            overflow-y: auto;
            z-index: 20;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        #input-panel h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
            text-align: center;
            border-bottom: 2px solid #e67e22;
            padding-bottom: 10px;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .input-group label {
            width: 60px;
            font-size: 14px;
            color: #bdc3c7;
        }

        .input-group input {
            flex: 1;
            background: #2c3e50;
            border: 1px solid #7f8c8d;
            border-radius: 4px;
            padding: 6px 10px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }

        .input-group input:focus {
            outline: none;
            border-color: #e67e22;
            box-shadow: 0 0 5px rgba(230, 126, 34, 0.5);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="result">?</div>
    <div id="canvas-container"></div>
    <div id="ui-container">
        <button id="roll-button">サイコロを振る</button>
    </div>

    <div id="input-panel">
        <h3>面の値をカスタム</h3>
        <div id="inputs-container"></div>
    </div>

    <script>
        // --- 全体設定と変数 ---
        let scene, camera, renderer, dice;
        let isRolling = false;
        
        // 物理挙動用変数
        let velocityY = 0;
        let posX = 0, posY = 0, posZ = 0;
        let rotSpeedX = 0, rotSpeedY = 0, rotSpeedZ = 0;
        const gravity = -0.015;
        const bounce = -0.55; 

        // 正十二面体（12面体）の各面の中心ベクトル
        const t = (1 + Math.sqrt(5)) / 2;
        const faceNormals = [
            new THREE.Vector3( 0,  1/t,  t).normalize(),
            new THREE.Vector3( 0,  1/t, -t).normalize(),
            new THREE.Vector3( 0, -1/t,  t).normalize(),
            new THREE.Vector3( 0, -1/t, -t).normalize(),
            new THREE.Vector3( 1/t,  t,  0).normalize(),
            new THREE.Vector3( 1/t, -t,  0).normalize(),
            new THREE.Vector3(-1/t,  t,  0).normalize(),
            new THREE.Vector3(-1/t, -t,  0).normalize(),
            new THREE.Vector3( t,  0,  1/t).normalize(),
            new THREE.Vector3( t,  0, -1/t).normalize(),
            new THREE.Vector3(-t,  0,  1/t).normalize(),
            new THREE.Vector3(-t,  0, -1/t).normalize()
        ];

        // 各面の初期値（インデックスに対応）
        let faceValues = ["1", "12", "2", "11", "3", "10", "4", "9", "5", "8", "6", "7"];

        // --- 初期化 ---
        function init() {
            // 入力欄の生成
            createInputFields();

            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();

            // カメラの位置（右側にパネルがあるので、少し左寄りに中央をずらすように調整も可ですが、基本はそのまま）
            camera = new THREE.PerspectiveCamera(45, (window.innerWidth - 280) / window.innerHeight, 0.1, 100);
            camera.position.set(-0.5, 7, 10); // サイコロの初期位置が見えやすいよう少し左にオフセット
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 15, 5);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // 床
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.ShadowMaterial({ opacity: 0.3 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -1.5;
            floor.receiveShadow = true;
            scene.add(floor);

            // サイコロの作成
            createDice();

            // イベントリスナー
            window.addEventListener('resize', onWindowResize, false);
            document.getElementById('roll-button').addEventListener('click', rollDice);

            animate();
        }

        // --- 右側の入力フォームを生成 ---
        function createInputFields() {
            const container = document.getElementById('inputs-container');
            for (let i = 0; i < 12; i++) {
                const group = document.createElement('div');
                group.className = 'input-group';

                const label = document.createElement('label');
                label.innerText = `面 ${i + 1}:`;

                const input = document.createElement('input');
                input.type = 'text';
                input.id = `face-input-${i}`;
                input.value = faceValues[i];
                // 入力内容が変わったらリアルタイムにサイコロのテクスチャを更新
                input.addEventListener('input', (e) => {
                    faceValues[i] = e.target.value;
                    updateDiceTextures();
                });

                group.appendChild(label);
                group.appendChild(input);
                container.appendChild(group);
            }
        }

        // --- キャンバス上に文字を描画してテクスチャを作る ---
        function createDiceTexture(text, isHighlight = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // 背景
            const grad = ctx.createRadialGradient(128, 128, 10, 128, 128, 140);
            grad.addColorStop(0, '#f1f2f6');
            grad.addColorStop(1, '#ced6e0');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);

            // 文字の描画
            ctx.save();
            ctx.translate(128, 128);
            
            // 文字列の長さに応じてフォントサイズを動的に調整（長い文字列がはみ出さないように）
            let fontSize = 85;
            if (text.length > 2) fontSize = 50;
            if (text.length > 4) fontSize = 35;

            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.fillStyle = isHighlight ? '#e67e22' : '#2c3e50'; // 当たり面はオレンジ
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            ctx.fillText(text, 0, 0);
            ctx.restore();

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // --- 12面体サイコロの生成 ---
        function createDice() {
            const geometry = new THREE.DodecahedronGeometry(1.5);
            const materials = [];
            for (let i = 0; i < 12; i++) {
                materials.push(new THREE.MeshStandardMaterial({
                    map: createDiceTexture(faceValues[i]),
                    roughness: 0.2,
                    metalness: 0.1
                }));
            }

            geometry.clearGroups();
            for (let i = 0; i < 12; i++) {
                geometry.addGroup(i * 6, 6, i);
            }

            dice = new THREE.Mesh(geometry, materials);
            dice.castShadow = true;
            dice.receiveShadow = true;
            
            resetDicePosition();
            scene.add(dice);
        }

        // --- すべての面のテクスチャを最新の入力値に書き換える ---
        function updateDiceTextures(highlightIndex = -1) {
            if (!dice) return;
            for (let i = 0; i < 12; i++) {
                const isHighlight = (i === highlightIndex);
                // 既存のテクスチャを解放してメモリリークを防ぐ
                if (dice.material[i].map) dice.material[i].map.dispose();
                
                dice.material[i].map = createDiceTexture(faceValues[i], isHighlight);
                dice.material[i].needsUpdate = true;
            }
        }

        function resetDicePosition() {
            posX = -0.5; posY = 0; posZ = 0;
            dice.position.set(posX, posY, posZ);
            dice.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        }

        // --- サイコロを振るアクション ---
        function rollDice() {
            if (isRolling) return;

            isRolling = true;
            document.getElementById('result').classList.remove('show');

            // 全て通常カラーに戻す
            updateDiceTextures();

            // 開始位置を空中へ（左寄りの位置から落とす）
            posX = -0.5 + (Math.random() - 0.5) * 1.5;
            posY = 4 + Math.random() * 2;
            posZ = (Math.random() - 0.5) * 1.5;
            dice.position.set(posX, posY, posZ);

            // 初期速度と回転力
            velocityY = 0.1;
            rotSpeedX = (Math.random() * 0.4 + 0.3) * (Math.random() > 0.5 ? 1 : -1);
            rotSpeedY = (Math.random() * 0.4 + 0.3) * (Math.random() > 0.5 ? 1 : -1);
            rotSpeedZ = (Math.random() * 0.4 + 0.3) * (Math.random() > 0.5 ? 1 : -1);
        }

        // --- どの面が上を向いているかの判定 ---
        function checkResult() {
            let maxDot = -1;
            let highestFaceIndex = 0;

            const rotationMatrix = new THREE.Matrix4().makeRotationFromEuler(dice.rotation);

            for (let i = 0; i < faceNormals.length; i++) {
                const worldNormal = faceNormals[i].clone().applyMatrix4(rotationMatrix);
                const dot = worldNormal.dot(new THREE.Vector3(0, 1, 0));

                if (dot > maxDot) {
                    maxDot = dot;
                    highestFaceIndex = i;
                }
            }

            // 結果を画面上に表示（入力欄に対応した任意の文字が表示される）
            const resultValue = faceValues[highestFaceIndex];
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = resultValue !== "" ? resultValue : `面 ${highestFaceIndex + 1}`;
            resultDiv.classList.add('show');

            // 出た面をオレンジにハイライト
            updateDiceTextures(highestFaceIndex);

            // 角度調整
            alignDiceToFace(highestFaceIndex);
        }

        function alignDiceToFace(faceIndex) {
            const targetNormal = faceNormals[faceIndex];
            const quaternion = new THREE.Quaternion().setFromUnitVectors(targetNormal, new THREE.Vector3(0, 1, 0));
            dice.quaternion.slerp(quaternion, 1.0);
        }

        // --- アニメーションループ ---
        function animate() {
            requestAnimationFrame(animate);

            if (isRolling) {
                velocityY += gravity;
                posY += velocityY;
                
                posX += rotSpeedX * 0.03;
                posZ += rotSpeedY * 0.03;

                dice.rotation.x += rotSpeedX;
                dice.rotation.y += rotSpeedY;
                dice.rotation.z += rotSpeedZ;

                if (posY <= -1.2) {
                    posY = -1.2;
                    velocityY = velocityY * bounce; 

                    rotSpeedX *= 0.6;
                    rotSpeedY *= 0.6;
                    rotSpeedZ *= 0.6;

                    if (Math.abs(velocityY) < 0.01 && Math.abs(rotSpeedX) < 0.01) {
                        isRolling = false;
                        velocityY = 0;
                        checkResult();
                    }
                }

                // 右側の入力パネルにめり込まないよう、X方向の移動範囲を制限
                if (posX > 1.5) posX = 1.5;
                if (posX < -3.0) posX = -3.0;
                posX *= 0.98;
                posZ *= 0.98;

                dice.position.set(posX, posY, posZ);
            }

            renderer.render(scene, camera);
        }

        // --- リサイズ処理 ---
        function onWindowResize() {
            // パネルの幅 (280px) を引いた領域でカメラのアスペクト比を再計算
            camera.aspect = (window.innerWidth - 280) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
