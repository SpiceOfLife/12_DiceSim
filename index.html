<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 12面体サイコロ - リアルUI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* 画像の美しいダークネイビーのグラデーションを再現 */
            background: radial-gradient(circle at center, #2c3a47 0%, #17202a 100%);
            font-family: 'Times New Roman', Times, serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* 中央下部の「サイコロを振る」ボタン */
        #ui-container {
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        button#roll-button {
            background: linear-gradient(135deg, #d35400, #e67e22);
            border: none;
            color: white;
            padding: 14px 45px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'sans-serif';
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: all 0.2s ease;
        }

        button#roll-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(230, 126, 34, 0.5);
        }

        button#roll-button:active {
            transform: translateY(1px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }

        /* 上部の結果表示テキスト */
        #result {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 42px;
            font-weight: bold;
            font-family: 'Georgia', 'Times New Roman', serif;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: 10;
            text-shadow: 0 0 15px rgba(255,255,255,0.6);
        }

        #result.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* 右下のカスタムメニュー起動用ボタン（画像右下の輝くアイコン風） */
        #menu-trigger {
            position: absolute;
            bottom: 4%;
            right: 4%;
            width: 35px;
            height: 35px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }
        #menu-trigger:hover {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        /* ポップアップ式の値入力パネル */
        #input-panel {
            position: absolute;
            bottom: 10%;
            right: 4%;
            width: 260px;
            max-height: 70vh;
            background: rgba(19, 28, 36, 0.92);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 12px;
            box-sizing: border-box;
            padding: 20px;
            color: #fff;
            overflow-y: auto;
            z-index: 20;
            border: 1px solid rgba(255,255,255,0.1);
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        #input-panel.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        #input-panel h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
            font-family: sans-serif;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 8px;
            color: #e67e22;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .input-group label {
            width: 50px;
            font-size: 12px;
            color: #a0aab2;
            font-family: sans-serif;
        }

        .input-group input {
            flex: 1;
            background: #253238;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            padding: 5px;
            color: #fff;
            font-size: 14px;
            text-align: center;
        }

        .input-group input:focus {
            outline: none;
            border-color: #e67e22;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="result">10</div>
    <div id="canvas-container"></div>
    
    <div id="ui-container">
        <button id="roll-button">サイコロを振る</button>
    </div>

    <div id="menu-trigger">✦</div>

    <div id="input-panel">
        <h3>面の値をカスタム</h3>
        <div id="inputs-container"></div>
    </div>

    <script>
        // --- 全体設定と変数 ---
        let scene, camera, renderer, dice;
        let isRolling = false;
        
        // 物理挙動用変数
        let velocityY = 0;
        let posX = 0, posY = 0, posZ = 0;
        let rotSpeedX = 0, rotSpeedY = 0, rotSpeedZ = 0;
        const gravity = -0.016;
        const bounce = -0.50; // 跳ね返りを少し抑えて安定化

        // 正十二面体の各面の法線ベクトル
        const t = (1 + Math.sqrt(5)) / 2;
        const faceNormals = [
            new THREE.Vector3( 0,  1/t,  t).normalize(),
            new THREE.Vector3( 0,  1/t, -t).normalize(),
            new THREE.Vector3( 0, -1/t,  t).normalize(),
            new THREE.Vector3( 0, -1/t, -t).normalize(),
            new THREE.Vector3( 1/t,  t,  0).normalize(),
            new THREE.Vector3( 1/t, -t,  0).normalize(),
            new THREE.Vector3(-1/t,  t,  0).normalize(),
            new THREE.Vector3(-1/t, -t,  0).normalize(),
            new THREE.Vector3( t,  0,  1/t).normalize(),
            new THREE.Vector3( t,  0, -1/t).normalize(),
            new THREE.Vector3(-t,  0,  1/t).normalize(),
            new THREE.Vector3(-t,  0, -1/t).normalize()
        ];

        // 各面の初期値（画像に合わせて10が目立つように割り当て）
        let faceValues = ["1", "12", "2", "11", "3", "10", "4", "9", "5", "8", "6", "7"];

        // --- 初期化 ---
        function init() {
            createInputFields();

            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();

            // カメラの設定（中央に綺麗に収まるアスペクト比）
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 6, 9);
            camera.lookAt(0, -0.5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 環境光（全体を自然に明るく）
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // メインのディレクショナルライト（画像のようなリアルな陰影とスポット効果）
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(0, 12, 4);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 20;
            dirLight.shadow.camera.left = -4;
            dirLight.shadow.camera.right = 4;
            dirLight.shadow.camera.top = 4;
            dirLight.shadow.camera.bottom = -4;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            // 補助ライト（下からの暗がりを防ぐ）
            const fillLight = new THREE.DirectionalLight(0x85929e, 0.3);
            fillLight.position.set(0, -5, 2);
            scene.add(fillLight);

            // 床面（影の受け皿）
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.ShadowMaterial({ opacity: 0.4 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -1.5;
            floor.receiveShadow = true;
            scene.add(floor);

            // サイコロの作成
            createDice();

            // イベントリスナー
            window.addEventListener('resize', onWindowResize, false);
            document.getElementById('roll-button').addEventListener('click', rollDice);
            
            // パネル開閉ボタンのロジック
            const trigger = document.getElementById('menu-trigger');
            const panel = document.getElementById('input-panel');
            trigger.addEventListener('click', () => {
                panel.classList.toggle('active');
            });

            animate();
        }

        // --- 右下の入力フォーム作成 ---
        function createInputFields() {
            const container = document.getElementById('inputs-container');
            for (let i = 0; i < 12; i++) {
                const group = document.createElement('div');
                group.className = 'input-group';

                const label = document.createElement('label');
                label.innerText = `面 ${i + 1}`;

                const input = document.createElement('input');
                input.type = 'text';
                input.id = `face-input-${i}`;
                input.value = faceValues[i];
                input.addEventListener('input', (e) => {
                    faceValues[i] = e.target.value;
                    updateDiceTextures();
                });

                group.appendChild(label);
                group.appendChild(input);
                container.appendChild(group);
            }
        }

        // --- 画像のようなシックな質感のテクスチャを生成 ---
        function createDiceTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // 高級感のあるダークグレーのグラデーション（金属・ダイキャスト風のベース）
            const grad = ctx.createRadialGradient(128, 128, 20, 128, 128, 130);
            grad.addColorStop(0, '#5d6d7e');
            grad.addColorStop(1, '#2e4053');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);

            // 内側にうっすらと縁取りを入れてリアルな立体感を出す
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 8;
            ctx.strokeRect(4, 4, 248, 248);

            // 文字の描画
            ctx.save();
            ctx.translate(128, 128);
            
            let fontSize = 80;
            if (text.length > 2) fontSize = 50;
            if (text.length > 4) fontSize = 32;

            // 画像のような太くて美しいセリフ体フォント
            ctx.font = `bold ${fontSize}px 'Georgia', serif`;
            ctx.fillStyle = '#ffffff'; // 白抜きの文字
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 彫り込まれたようなシャドウ効果
            ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 3;

            ctx.fillText(text, 0, 0);
            ctx.restore();

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // --- サイコロの構築 ---
        function createDice() {
            const geometry = new THREE.DodecahedronGeometry(1.4); // サイズを微調整
            const materials = [];
            for (let i = 0; i < 12; i++) {
                materials.push(new THREE.MeshStandardMaterial({
                    map: createDiceTexture(faceValues[i]),
                    roughness: 0.3,
                    metalness: 0.4 // 金属感をプラスして画像に接近
                }));
            }

            geometry.clearGroups();
            for (let i = 0; i < 12; i++) {
                geometry.addGroup(i * 6, 6, i);
            }

            dice = new THREE.Mesh(geometry, materials);
            dice.castShadow = true;
            dice.receiveShadow = true;
            
            resetDicePosition();
            scene.add(dice);
        }

        function updateDiceTextures() {
            if (!dice) return;
            for (let i = 0; i < 12; i++) {
                if (dice.material[i].map) dice.material[i].map.dispose();
                dice.material[i].map = createDiceTexture(faceValues[i]);
                dice.material[i].needsUpdate = true;
            }
        }

        function resetDicePosition() {
            posX = 0; posY = -0.1; posZ = 0; // 画像の静止位置に合わせる
            dice.position.set(posX, posY, posZ);
            // 最初は10が綺麗に正面を向くように角度を固定
            dice.rotation.set(0.2, 0.5, 0);
            
            // 初期状態で画像と同じ「10」を表示しておく
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = "10";
            resultDiv.classList.add('show');
        }

        // --- サイコロを振るアクション ---
        function rollDice() {
            if (isRolling) return;

            isRolling = true;
            document.getElementById('result').classList.remove('show');

            // 完全に中央上空にリセット
            posX = (Math.random() - 0.5) * 0.5; // 横ブレを小さくして画面外飛び出しを防止
            posY = 4.5 + Math.random() * 1.5;   // 適度な高さ
            posZ = (Math.random() - 0.5) * 0.5;
            dice.position.set(posX, posY, posZ);

            // 初期速度と十分な回転力を付与
            velocityY = 0.08;
            rotSpeedX = (Math.random() * 0.3 + 0.25) * (Math.random() > 0.5 ? 1 : -1);
            rotSpeedY = (Math.random() * 0.3 + 0.25) * (Math.random() > 0.5 ? 1 : -1);
            rotSpeedZ = (Math.random() * 0.3 + 0.25) * (Math.random() > 0.5 ? 1 : -1);
        }

        // --- 正確な出目の判定 ---
        function checkResult() {
            let maxDot = -1;
            let highestFaceIndex = 0;

            const rotationMatrix = new THREE.Matrix4().makeRotationFromEuler(dice.rotation);

            for (let i = 0; i < faceNormals.length; i++) {
                const worldNormal = faceNormals[i].clone().applyMatrix4(rotationMatrix);
                const dot = worldNormal.dot(new THREE.Vector3(0, 1, 0));

                if (dot > maxDot) {
                    maxDot = dot;
                    highestFaceIndex = i;
                }
            }

            const resultValue = faceValues[highestFaceIndex];
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = resultValue !== "" ? resultValue : `面 ${highestFaceIndex + 1}`;
            resultDiv.classList.add('show');

            alignDiceToFace(highestFaceIndex);
        }

        function alignDiceToFace(faceIndex) {
            const targetNormal = faceNormals[faceIndex];
            const quaternion = new THREE.Quaternion().setFromUnitVectors(targetNormal, new THREE.Vector3(0, 1, 0));
            dice.quaternion.slerp(quaternion, 1.0);
        }

        // --- アニメーションループ（物理演算と画面外対策） ---
        function animate() {
            requestAnimationFrame(animate);

            if (isRolling) {
                // 重力の適用
                velocityY += gravity;
                posY += velocityY;
                
                // 位置の移動
                posX += rotSpeedX * 0.04;
                posZ += rotSpeedY * 0.04;

                // 回転の適用
                dice.rotation.x += rotSpeedX;
                dice.rotation.y += rotSpeedY;
                dice.rotation.z += rotSpeedZ;

                // 【バグ対策】床（y = -1.3）との衝突判定
                if (posY <= -1.25) {
                    posY = -1.25;
                    velocityY = velocityY * bounce; 

                    // 衝突の衝撃で回転速度を徐々に減衰
                    rotSpeedX *= 0.55;
                    rotSpeedY *= 0.55;
                    rotSpeedZ *= 0.55;

                    // 完全にエネルギーが無くなったら停止
                    if (Math.abs(velocityY) < 0.01 && Math.abs(rotSpeedX) < 0.01) {
                        isRolling = false;
                        velocityY = 0;
                        checkResult();
                    }
                }

                // 【超重要】サイコロ消滅・見失い絶対防止用の見えない壁（境界制限）
                if (posX > 1.8) { posX = 1.8; rotSpeedX *= -0.5; }
                if (posX < -1.8) { posX = -1.8; rotSpeedX *= -0.5; }
                if (posZ > 1.5) { posZ = 1.5; rotSpeedY *= -0.5; }
                if (posZ < -1.5) { posZ = -1.5; rotSpeedY *= -0.5; }

                // 自然に画面中央に戻るように緩やかに摩擦（空気抵抗）をかける
                posX *= 0.95;
                posZ *= 0.95;

                dice.position.set(posX, posY, posZ);
            }

            renderer.render(scene, camera);
        }

        // --- リサイズ処理 ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
